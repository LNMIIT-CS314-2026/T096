{% extends "base.html" %}

{% block title %}Enter Reset Code &amp; New Password - IQAC Portal{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Set New Password</h2>
            <p class="auth-subtitle">Verification code sent to <strong>{{ email }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password') }}" class="auth-form">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="form-group">
                <label for="otp_code">6-Digit OTP Code <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="otp_code" 
                    name="otp_code" 
                    maxlength="6" 
                    pattern="[0-9]{6}" 
                    placeholder="e.g. 123456" 
                    required 
                    autofocus
                    class="form-control otp-input"
                >
                <small class="form-hint">Exactly 6 digits. Single-use only.</small>
            </div>

            <div class="form-group">
                <label for="new_password">New Password <span class="required">*</span></label>
                <input 
                    type="password" 
                    id="new_password" 
                    name="new_password" 
                    placeholder="Min 6, max 64 characters" 
                    minlength="6"
                    maxlength="64"
                    required 
                    class="form-control"
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password <span class="required">*</span></label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    placeholder="Re-enter new password" 
                    minlength="6"
                    maxlength="64"
                    required 
                    class="form-control"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">Confirm &amp; Update Password</button>
        </form>

        <div class="auth-footer-actions">
            <form method="POST" action="{{ url_for('auth.resend_reset_otp') }}" style="display: inline;">
                <input type="hidden" name="email" value="{{ email }}">
                <button type="submit" class="btn-link">Resend Code</button>
            </form>
            &bull;
            <a href="{{ url_for('auth.forgot_password') }}" class="btn-link">Change Email</a>
            &bull;
            <a href="{{ url_for('auth.login') }}" class="btn-link">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
