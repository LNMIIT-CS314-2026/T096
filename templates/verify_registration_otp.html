{% extends "base.html" %}

{% block title %}Verify Registration Code - IQAC Portal{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Complete Registration</h2>
            <p class="auth-subtitle">A 6-digit confirmation code was sent to <strong>{{ email }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('auth.verify_registration') }}" class="auth-form">
            <div class="form-group">
                <label for="otp_code">6-Digit Verification Code <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="otp_code" 
                    name="otp_code" 
                    maxlength="6" 
                    pattern="[0-9]{6}" 
                    placeholder="e.g. 123456" 
                    required 
                    autofocus
                    class="form-control otp-input"
                >
                <small class="form-hint">Enter the 6-digit code received via institutional email.</small>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Verify Email &amp; Activate Account</button>
        </form>

        <div class="auth-footer-actions">
            <form method="POST" action="{{ url_for('auth.resend_registration_otp') }}" style="display: inline;">
                <button type="submit" class="btn-link">Resend Code</button>
            </form>
            &bull;
            <a href="{{ url_for('auth.register') }}" class="btn-link">Edit Details</a>
        </div>
    </div>
</div>
{% endblock %}
