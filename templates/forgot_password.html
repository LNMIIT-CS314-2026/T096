{% extends "base.html" %}

{% block title %}Forgot Password - IQAC User Portal{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Reset Password</h2>
            <p class="auth-subtitle">A security OTP will be dispatched to verify your identity</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Institutional Email Address <span class="required">*</span></label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    value="{{ email or '' }}" 
                    placeholder="e.g. user@lnmiit.ac.in" 
                    maxlength="100"
                    required 
                    class="form-control"
                    autofocus
                >
                <small class="form-hint">Max 100 characters. Must be a registered institutional account.</small>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Send Reset OTP</button>
        </form>

        <div style="text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0;">
            <a href="{{ url_for('auth.login') }}" class="btn-link">&larr; Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
